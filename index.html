<script>
function getProductsArray(data) {

    if (Array.isArray(data)) {

        return data;
    }

    if (data && Array.isArray(data.products)) {

        return data.products;
    }

    return [];
}

function formatProductPrice(product) {

    if (product.price_text) {

        return product.price_text;
    }

    if (product.price === 0) {

        return "0";
    }

    if (product.price) {

        return String(product.price);
    }

    return "";
}

function appendProductDescription(container, description) {

    const text =
        description || "";

    const lines =
        text.split(/\r?\n/);

    for (const line of lines) {

        if (!line.trim()) {

            continue;
        }

        const paragraph =
            document.createElement("p");

        paragraph.textContent =
            line;

        container.appendChild(
            paragraph
        );
    }
}

function createProductElement(product) {

    const section =
        document.createElement("section");

    const heading =
        document.createElement("h2");

    heading.tabIndex =
        -1;

    heading.textContent =
        product.name || "Продукт";

    section.appendChild(
        heading
    );

    const price =
        formatProductPrice(product);

    if (price) {

        const priceParagraph =
            document.createElement("p");

        priceParagraph.textContent =
            "Цена: " + price;

        section.appendChild(
            priceParagraph
        );
    }

    appendProductDescription(
        section,
        product.full_description || product.description
    );

    if (product.can_download && product.download_url) {

        const paragraph =
            document.createElement("p");

        paragraph.className =
            "download";

        const link =
            document.createElement("a");

        link.className =
            "button";

        link.href =
            product.download_url;

        link.textContent =
            product.download_button_text || "Скачать";

        paragraph.appendChild(
            link
        );

        section.appendChild(
            paragraph
        );
    }

    if (product.can_buy) {

        const paragraph =
            document.createElement("p");

        const button =
            document.createElement("button");

        button.type =
            "button";

        button.className =
            "button";

        button.textContent =
            product.purchase_button_text || "Купить";

        button.dataset.purchaseUrl =
            product.purchase_url || "";

        paragraph.appendChild(
            button
        );

        section.appendChild(
            paragraph
        );
    }

    return section;
}

async function loadProducts() {

    const container =
        document.getElementById(
            "products-list"
        );

    if (!container) {

        return;
    }

    try {

        const response =
            await fetch(
                "https://api.blindsoft.ru/api/products"
            );

        if (!response.ok) {

            throw new Error();
        }

        const data =
            await response.json();

        const products =
            getProductsArray(data);

        container.textContent =
            "";

        if (products.length === 0) {

            container.textContent =
                "Список продуктов пока пуст.";

            return;
        }

        for (const product of products) {

            container.appendChild(
                createProductElement(product)
            );
        }

    } catch {

        container.textContent =
            "Не удалось загрузить список продуктов.";
    }
}

document.addEventListener(
    "DOMContentLoaded",
    loadProducts
);
</script>
